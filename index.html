  <body>
    <div id="root">
      <!-- 48MBのバンドル解析中も真っ白にならないよう、React初期化前の置き画を置く -->
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Meiryo', sans-serif; color: #555;">
        NOW LOADING...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // file:// 直接起動時に真っ白のまま原因が分からなくならないよう自己診断する
      window.__bootErrors = [];
      window.addEventListener('error', function (e) {
        window.__bootErrors.push(String((e && e.message) || e));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootErrors.push(String((e && e.reason) || e));
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        var booted = document.querySelector('canvas') !== null;
        var rootText = root ? root.textContent || '' : '';
        var rootBusy = root !== null && root.children.length > 0 && rootText.indexOf('NOW LOADING') < 0;
        if (booted || rootBusy) return;
        var info = [
          '起動が完了していません(自己診断)',
          'UA: ' + navigator.userAgent,
          '捕捉エラー: ' + (window.__bootErrors.join(' | ') || 'なし'),
          'root子要素: ' + (root ? root.children.length : 'root無し'),
          'script数: ' + document.scripts.length
        ];
        var pre = document.createElement('pre');
        pre.style.cssText =
          'margin:24px;padding:16px;background:#fff;color:#c0392b;font:13px monospace;white-space:pre-wrap;border:2px solid #c0392b;border-radius:8px';
        pre.textContent = info.join('\n');
        document.body.appendChild(pre);
      }, 10000);
    </script>
  </body>
